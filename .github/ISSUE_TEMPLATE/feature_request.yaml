name: 🚀 Feature Request
description: Suggest an idea or improvement for Symfinit
labels: enhancement

body:
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: I'm always frustrated when...
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: "Optional: any alternative solutions or features you've considered."
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: "Optional: any other context, mockups, or screenshots about the feature request."
